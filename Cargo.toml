[package]
name = "lapinq-worker"
version = "1.2.0"
description = "Lapinq Rust worker - polls PostgreSQL and executes Python tasks"
edition = "2021"

[lib]
name = "_worker"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "lapinq-worker"
path = "src/main.rs"

[features]
default = []
tls = ["dep:tokio-postgres-rustls", "dep:rustls"]

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-postgres = { version = "0.7", features = ["with-uuid-1", "with-serde_json-1", "with-chrono-0_4"] }
tokio-postgres-rustls = { version = "0.14", optional = true }
rustls = { version = "0.23", optional = true, default-features = false, features = ["ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
deadpool-postgres = { version = "0.14", features = ["serde"] }
log = "0.4"
env_logger = "0.11"
pyo3 = { version = "0.28", features = ["extension-module"] }
