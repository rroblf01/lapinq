name: Publish

on:
  push:
    tags: ["v*"]

jobs:
  build-linux:
    name: Linux ${{ matrix.target }} (manylinux)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Build wheel
        run: |
          pip install maturin
          maturin build --release --out dist --manylinux auto \
            --target ${{ matrix.target == 'aarch64' && 'aarch64-unknown-linux-gnu' || 'x86_64-unknown-linux-gnu' }}
      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel-linux-${{ matrix.target }}
          path: dist

  build-windows:
    name: Windows cp${{ matrix.python-version }}
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Build wheel
        run: |
          pip install maturin
          maturin build --release --out dist
      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel-win-cp${{ matrix.python-version }}
          path: dist

  build-macos:
    name: macOS cp${{ matrix.python-version }}
    runs-on: macos-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Add x86_64 target
        run: rustup target add x86_64-apple-darwin
      - name: Build arm64 wheel
        run: |
          pip install maturin
          maturin build --release --out dist
      - name: Build x86_64 wheel
        run: |
          maturin build --release --out dist --target x86_64-apple-darwin
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheel-macos-cp${{ matrix.python-version }}
          path: dist

  build-sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Build sdist
        run: |
          pip install maturin
          maturin sdist --out dist
      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: wheel-sdist
          path: dist

  publish:
    name: Publish to PyPI
    needs: [build-linux, build-windows, build-macos, build-sdist]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist
      - name: Publish
        run: |
          pip install maturin
          maturin upload --non-interactive --skip-existing dist/*
