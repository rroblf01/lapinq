name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  PYTHON_VERSION: "3.14"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install uv
        run: pip install uv
      - uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ env.PYTHON_VERSION }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: venv-${{ runner.os }}-${{ env.PYTHON_VERSION }}-
      - name: Install dependencies
        run: uv sync --frozen --no-dev
      - name: Run ruff
        run: uv run ruff check python/ tests/
      - name: Run ty
        run: uv run ty check python/lapinq/ tests/ --python-version 3.14

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build
      - name: Test
        run: cargo test

  build-wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Build wheel
        run: |
          pip install maturin
          maturin build --release --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: wheel
          path: dist/*.whl

  test-linux:
    needs: build-wheel
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
          POSTGRES_DB: lapinq_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        run: pip install uv
      - uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: venv-${{ runner.os }}-${{ matrix.python-version }}-
      - name: Install dependencies
        run: uv sync --frozen
      - uses: actions/download-artifact@v4
        with:
          name: wheel
          path: dist/
      - name: Install wheel
        run: uv pip install dist/*.whl --reinstall
      - name: Run tests
        run: uv run pytest tests/test_client.py tests/test_cli.py tests/test_log.py -v -n auto
        env:
          DATABASE_URL: postgresql://postgres:test@localhost:5432/lapinq_test
      - name: Run DB tests
        run: uv run pytest tests/ -v -m "not slow" --ignore=tests/test_client.py --ignore=tests/test_cli.py --ignore=tests/test_log.py
        env:
          DATABASE_URL: postgresql://postgres:test@localhost:5432/lapinq_test

  test-slow:
    needs: build-wheel
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
          POSTGRES_DB: lapinq_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install uv
        run: pip install uv
      - uses: actions/cache@v4
        with:
          path: .venv
          key: venv-slow-${{ runner.os }}-${{ env.PYTHON_VERSION }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: venv-slow-${{ runner.os }}-${{ env.PYTHON_VERSION }}-
      - name: Install dependencies
        run: uv sync --frozen
      - uses: actions/download-artifact@v4
        with:
          name: wheel
          path: dist/
      - name: Install wheel
        run: uv pip install dist/*.whl --reinstall
      - name: Build Rust binary
        run: cargo build
      - name: Run slow tests
        run: uv run pytest tests/ -v -m "slow"
        env:
          DATABASE_URL: postgresql://postgres:test@localhost:5432/lapinq_test

  test-macos:
    needs: build-wheel
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ikalnytskyi/action-setup-postgres@v8
        with:
          password: test
          database: lapinq_test
          postgres-version: "16"
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install uv
        run: pip install uv
      - uses: actions/cache@v4
        with:
          path: .venv
          key: venv-macos-${{ env.PYTHON_VERSION }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: venv-macos-${{ env.PYTHON_VERSION }}-
      - name: Install dependencies
        run: uv sync --frozen
      - uses: actions/download-artifact@v4
        with:
          name: wheel
          path: dist/
      - name: Install wheel
        run: uv pip install dist/*.whl --reinstall
      - name: Run tests
        run: uv run pytest tests/test_client.py tests/test_cli.py tests/test_log.py -v -n auto
        env:
          DATABASE_URL: postgresql://postgres:test@localhost:5432/lapinq_test
      - name: Run DB tests
        run: uv run pytest tests/ -v -m "not slow" --ignore=tests/test_client.py --ignore=tests/test_cli.py --ignore=tests/test_log.py
        env:
          DATABASE_URL: postgresql://postgres:test@localhost:5432/lapinq_test

  test-windows:
    needs: build-wheel
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ikalnytskyi/action-setup-postgres@v8
        with:
          password: test
          database: lapinq_test
          postgres-version: "16"
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install uv
        run: pip install uv
      - uses: actions/cache@v4
        with:
          path: .venv
          key: venv-win-${{ env.PYTHON_VERSION }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: venv-win-${{ env.PYTHON_VERSION }}-
      - name: Install dependencies
        run: uv sync --frozen
      - uses: actions/download-artifact@v4
        with:
          name: wheel
          path: dist/
      - name: Install wheel
        run: uv pip install --find-links dist lapinq --reinstall
      - name: Run tests
        run: uv run pytest tests/test_client.py tests/test_cli.py tests/test_log.py -v -n auto
        env:
          DATABASE_URL: postgresql://postgres:test@localhost:5432/lapinq_test
      - name: Run DB tests
        run: uv run pytest tests/ -v -m "not slow" --ignore=tests/test_client.py --ignore=tests/test_cli.py --ignore=tests/test_log.py
        env:
          DATABASE_URL: postgresql://postgres:test@localhost:5432/lapinq_test

  coverage:
    needs: build-wheel
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
          POSTGRES_DB: lapinq_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install uv
        run: pip install uv
      - uses: actions/cache@v4
        with:
          path: .venv
          key: venv-cov-${{ runner.os }}-${{ env.PYTHON_VERSION }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: venv-cov-${{ runner.os }}-${{ env.PYTHON_VERSION }}-
      - name: Install dependencies
        run: uv sync --frozen
      - uses: actions/download-artifact@v4
        with:
          name: wheel
          path: dist/
      - name: Install wheel
        run: uv pip install dist/*.whl --reinstall
      - name: Run tests with coverage
        run: uv run pytest tests/ -v -m "not slow" --cov --cov-report=xml
        env:
          DATABASE_URL: postgresql://postgres:test@localhost:5432/lapinq_test
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build Docker image
        run: docker build -t lapinq .
