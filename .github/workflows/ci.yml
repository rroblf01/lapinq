name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install uv
        run: pip install uv
      - name: Install dependencies
        run: uv sync
      - name: Run ruff
        run: uv run ruff check python/ tests/
      - name: Run ty
        run: uv run ty check python/lapinq/ tests/ --python-version 3.14

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Build
        run: cargo build
      - name: Test
        run: cargo test

  test-linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
          POSTGRES_DB: lapinq_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        run: pip install uv
      - name: Install maturin
        run: uv add maturin
      - name: Build package
        run: uv run maturin develop
      - name: Run tests
        run: uv run pytest tests/ -v -m "not slow"
        env:
          DATABASE_URL: postgresql://postgres:test@localhost:5432/lapinq_test

  test-slow:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
          POSTGRES_DB: lapinq_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install uv
        run: pip install uv
      - name: Install maturin
        run: uv add maturin
      - name: Build Rust binary
        run: cargo build
      - name: Build package
        run: uv run maturin develop
      - name: Run slow tests
        run: uv run pytest tests/ -v -m "slow"
        env:
          DATABASE_URL: postgresql://postgres:test@localhost:5432/lapinq_test

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install PostgreSQL (chocolatey)
        shell: pwsh
        run: |
          choco install postgresql --params "'/Password:test'" --force --no-progress
          $pgDir = Get-ChildItem "C:\Program Files\PostgreSQL" -Directory `
            | Sort-Object Name -Descending | Select-Object -First 1
          $pgBin = Join-Path $pgDir.FullName "bin"
          echo "$pgBin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          Start-Service -Name "postgresql*" -ErrorAction SilentlyContinue
          Start-Sleep 5
          & "$pgBin\psql" -U postgres -c "CREATE DATABASE lapinq_test;"
      - name: Install uv
        run: pip install uv
      - name: Install maturin
        run: uv add maturin
      - name: Build package
        run: uv run maturin develop
      - name: Run tests
        run: uv run pytest tests/ -v -m "not slow"
        env:
          DATABASE_URL: postgresql://postgres:test@localhost:5432/lapinq_test

  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install and start PostgreSQL
        run: |
          brew install postgresql
          brew services start postgresql
          sleep 3
          for i in $(seq 1 20); do
            pg_isready && break
            sleep 1
          done
          psql -c "CREATE ROLE postgres LOGIN SUPERUSER PASSWORD 'test';" postgres 2>/dev/null || true
          psql -c "CREATE DATABASE lapinq_test OWNER postgres;" postgres 2>/dev/null || true
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
      - name: Install uv
        run: pip install uv
      - name: Install maturin
        run: uv add maturin
      - name: Build package
        run: uv run maturin develop
      - name: Run tests
        run: uv run pytest tests/ -v -m "not slow"
        env:
          DATABASE_URL: postgresql://postgres:test@localhost:5432/lapinq_test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Build wheel
        run: |
          pip install maturin
          maturin build --release
      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: target/wheels/*.whl
