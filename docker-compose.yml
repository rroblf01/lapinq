version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: lagomorph_postgres
    restart: always
    environment:
      POSTGRES_USER: lagomorph
      POSTGRES_PASSWORD: lagomorph_secret
      POSTGRES_DB: lagomorph
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lagomorph -d lagomorph"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build: .
    container_name: lagomorph_server
    restart: always
    command: python -m lagomorph server --host 0.0.0.0 --port 8001 --concurrency 4
    volumes:
      - .:/app
    ports:
      - "8001:8001"
    environment:
      - DATABASE_URL=postgresql://lagomorph:lagomorph_secret@db:5432/lagomorph
      - MAX_CONCURRENT_TASKS=4
    depends_on:
      db:
        condition: service_healthy

  # Optional: Rust worker binary (runs alongside Python server)
  rust-worker:
    build: .
    container_name: lagomorph_rust_worker
    restart: always
    command: lagomorph-worker --database-url postgresql://lagomorph:lagomorph_secret@db:5432/lagomorph --concurrency 4
    environment:
      - DATABASE_URL=postgresql://lagomorph:lagomorph_secret@db:5432/lagomorph
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - rust

  # Optional: Python native worker
  python-worker:
    build: .
    container_name: lagomorph_python_worker
    restart: always
    command: python -m lagomorph worker --database-url postgresql://lagomorph:lagomorph_secret@db:5432/lagomorph --concurrency 4
    environment:
      - DATABASE_URL=postgresql://lagomorph:lagomorph_secret@db:5432/lagomorph
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - python

volumes:
  postgres_data:
