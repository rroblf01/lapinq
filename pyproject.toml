[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "lapinq"
version = "1.2.0"
description = "A lightweight task queue with PostgreSQL backend"
readme = "README.md"
authors = [
    { name = "Ricardo Robles", email = "ricardo.r.f@hotmail.com" }
]
requires-python = ">=3.10"
license = { text = "MIT" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Topic :: System :: Distributed Computing",
    "Typing :: Typed",
]
dependencies = [
    "starlette>=1.0.1",
    "uvicorn[standard]>=0.47.0",
    "asyncpg>=0.31.0",
    "httpx>=0.28.1",
]

[project.urls]
Homepage = "https://github.com/ricardorobles/lapinq"
Repository = "https://github.com/ricardorobles/lapinq"
Documentation = "https://ricardorobles.github.io/lapinq"

[project.scripts]
lapinq = "lapinq.__main__:main"

[tool.maturin]
python-source = "python"
module-name = "lapinq._worker"
features = ["pyo3/abi3-py310"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "slow: Subprocess-based tests that take >30s (skipped by default in CI)",
]

[tool.coverage.run]
source_pkgs = ["lapinq"]
branch = true

[tool.ruff]
target-version = "py310"
line-length = 130

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "LOG"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"


[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.14",
    "ty>=0.0.38",
    "testcontainers>=4.14.2",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.6",
    "mkdocs-static-i18n>=1.3.1",
    "fastapi>=0.136.1",
    "django>=5.2.14",
]
