services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lapinq
      POSTGRES_PASSWORD: lapinq
      POSTGRES_DB: lapinq
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lapinq"]
      interval: 2s
      timeout: 2s
      retries: 10

  lapinq:
    build:
      context: ..
      dockerfile: example/Dockerfile
    command: python -m lapinq server --worker --port 8001
    ports:
      - "8001:8001"
    environment:
      DATABASE_URL: postgresql://lapinq:lapinq@postgres:5432/lapinq
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build:
      context: ..
      dockerfile: example/Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://lapinq:lapinq@postgres:5432/lapinq
      LAGOMORPH_SERVER_URL: http://lapinq:8001
    volumes:
      - ./app:/workspace/example/app
    depends_on:
      postgres:
        condition: service_healthy
      lapinq:
        condition: service_started
